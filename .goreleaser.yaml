version: 2

project_name: perfguard

before:
  hooks:
    - go mod tidy

builds:
  - id: perfguard
    main: ./cmd/perfguard
    binary: perfguard
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/kyyril/perfguard/internal/cli.Version={{.Version}}
      - -X github.com/kyyril/perfguard/internal/cli.Commit={{.Commit}}
      - -X github.com/kyyril/perfguard/internal/cli.Date={{.Date}}

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - schemas/*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
