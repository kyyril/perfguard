name: PerfGuard Dogfooding

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  perfguard:
    name: PerfGuard Self-Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build PerfGuard binary
        run: go install ./cmd/perfguard

      - name: Run PerfGuard Action
        uses: ./
        with:
          base: ${{ github.event.pull_request.base.sha }}
          config: perfguard.yaml
          token: ${{ secrets.GITHUB_TOKEN }}
          upload-artifacts: true
