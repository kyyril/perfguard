name: Performance Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  perfguard:
    name: Performance Regression Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PerfGuard
        run: |
          wget -O- -nv https://github.com/golangci/golangci-lint/releases/download/v1.64.8/golangci-lint-1.64.8-linux-amd64.tar.gz | tar -xz
          go install github.com/kyyril/perfguard/cmd/perfguard@v1.0.0

      - name: Run PerfGuard check
        id: perfguard
        run: |
          perfguard check --base origin/${{ github.base_ref }} || echo "PERFGUARD_FAILED=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Post PR comment
        if: always()
        run: |
          if [ -f .perfguard/comparison.json ]; then
            perfguard gh-comment --comparison .perfguard/comparison.json
          else
            echo "No comparison.json found - PerfGuard did not complete"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check result
        if: steps.perfguard.outputs.PERFGUARD_FAILED == 'true'
        run: |
          echo "::error::Performance regression detected. See PR comment for details."
          exit 1
